<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>מדוזה — מוקאפ</title>
<style>
:root{--bg:#F7F9FF;--card:rgba(255,255,255,.88);--tx:#1E1B2E;--tx2:#5B5875;--h:#2A1458;--p:#3B1F6E;--b:#2F5BD3;--a:#5BC0F0;--m:#6B4BC2;--soft:#E3F4FD;--ln:rgba(59,31,110,.1);--sh:0 4px 18px rgba(59,31,110,.08);--red:#D6455D;--grn:#2E9E7A}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112A;--card:rgba(44,36,78,.72);--tx:#ECEAF7;--tx2:#A9A5C4;--h:#fff;--soft:rgba(91,192,240,.16);--ln:rgba(255,255,255,.1)}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Heebo,Arial,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 100% 0,rgba(107,75,194,.07),transparent),radial-gradient(800px 500px at 0 100%,rgba(91,192,240,.09),transparent),var(--bg);display:flex;font-size:14px}
button{font:inherit;cursor:pointer;border:0}
#sb{width:210px;flex:none;background:linear-gradient(180deg,rgba(59,31,110,.95),rgba(47,91,211,.85));color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:4px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2F5BD3,#3B1F6E);box-shadow:inset 0 0 0 2px rgba(91,192,240,.7),0 0 14px rgba(91,192,240,.5);display:grid;place-items:center;font-style:normal}
.desc{font-size:11px;opacity:.7;margin:0 0 14px}
.nv{background:none;color:#fff;text-align:right;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;border-inline-start:3px solid transparent;opacity:.85}
.nv:hover{background:rgba(255,255,255,.08)}.nv.on{background:rgba(91,192,240,.18);border-inline-start-color:var(--a);opacity:1}
.bd{margin-inline-start:auto;background:var(--a);color:var(--p);border-radius:9px;padding:0 7px;font-size:11px;font-weight:700}
#mn{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#tb{display:flex;align-items:center;gap:14px;padding:14px 26px 6px;position:relative;z-index:5}
.sel{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh);position:relative}
.sel>div{position:relative}.sel button{background:none;color:var(--h);padding:9px 16px;font-weight:500}
.sel>div+div{border-inline-start:1px solid var(--ln)}.sel button.on{color:var(--m);background:var(--soft)}
.dd{position:absolute;top:110%;inset-inline-start:0;min-width:140px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:10px;box-shadow:var(--sh);padding:4px;z-index:9}
.dd button{display:block;width:100%;text-align:right;padding:8px 10px;border-radius:7px;color:var(--tx)}.dd button:hover,.dd button.on{background:var(--soft)}
.sp{flex:1}#bellw{position:relative}
.bell{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;box-shadow:var(--sh);color:var(--h)}
.bell b{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-inline-start:6px}
.bp{position:absolute;top:120%;inset-inline-end:0;width:320px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:14px;box-shadow:0 10px 30px rgba(59,31,110,.18);padding:10px}
#pg{flex:1;overflow:auto;padding:8px 26px 26px}
h1{color:var(--h);font-size:22px;margin:10px 0 14px;display:flex;align-items:center;gap:12px}
h1:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,rgba(91,192,240,.7),transparent);max-width:160px}
h3{color:var(--p);margin:16px 0 8px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:14px}
.btn{background:var(--p);color:#fff;padding:8px 16px;border-radius:10px}.btn:hover{background:#2A1458}.btn.s{background:var(--b)}
.btn.l{background:var(--soft);color:var(--p)}.btn.o{background:none;border:1px solid var(--p);color:var(--p)}.btn:disabled{background:#D9D6E5;color:#8E8AA3;cursor:default}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:rgba(91,192,240,.18);color:var(--b)}
.pill.r{background:rgba(214,69,93,.13);color:var(--red)}.pill.g{background:rgba(46,158,122,.14);color:var(--grn)}.pill.x{background:rgba(91,88,117,.12);color:var(--tx2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#cs{display:flex;gap:12px;align-items:stretch}.hc{flex:1 1 0;min-width:0;max-height:430px;overflow:auto}.hc:hover{border-color:rgba(91,192,240,.7)}
.mt{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--ln)}.mt b{color:var(--h)}
.pl{display:flex;align-items:center;gap:8px}.st{flex:1;text-align:center;padding:16px 8px}.st.ok{border-top:4px solid var(--grn)}.st.run{border-top:4px solid var(--a)}.st.bad{border-top:4px solid var(--red)}
.big{font-size:26px;font-weight:700;color:var(--h)}.cn{cursor:pointer;text-align:center}.cn.on{outline:2px solid var(--m);background:var(--soft)}
table{width:100%;border-collapse:collapse}th{color:var(--tx2);font-weight:500;text-align:right;padding:8px;border-bottom:1px solid var(--ln)}td{padding:8px;border-bottom:1px solid var(--ln)}tr:hover td{background:var(--soft)}
.tl{border-inline-start:2px solid var(--ln);padding-inline-start:16px;margin-inline-start:6px}.ev{position:relative;padding:6px 0}.ev:before{content:"";position:absolute;inset-inline-start:-23px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--d)}
input[type=text]{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);min-width:240px}
.chip{padding:5px 14px;border-radius:20px;background:var(--card);border:1px solid var(--ln);color:var(--tx)}.chip.on{background:var(--m);color:#fff}
.al{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--ln)}.al:hover{background:var(--soft)}.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--m);margin-inline-start:auto;cursor:pointer}
#pn{position:fixed;top:0;bottom:0;inset-inline-end:auto;left:0;width:340px;background:var(--card);backdrop-filter:blur(14px);border-inline-end:1px solid var(--ln);box-shadow:8px 0 30px rgba(59,31,110,.15);padding:24px;z-index:20}
#md{position:fixed;inset:0;background:rgba(42,20,88,.35);display:grid;place-items:center;z-index:30}#md .c{width:420px;background:var(--bg)}
.tile.off{opacity:.55}.ar{color:var(--m);font-size:22px}.pth{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 20px;border-radius:12px;z-index:40}
</style></head><body>
<div id="sb"></div><div id="mn"><div id="tb"></div><div id="pg"></div></div><div id="ov2"></div>
<script>
const $=s=>document.querySelector(s);
const H=[["אלפא","בטא","גמא"],["מערכת צפון","מערכת דרום"],["רכיב 1","רכיב 2","רכיב 3"]],PR=["אלפא","בטא","גמא","דלתא"];
const CM=["נכנסו","רצים כעת","עברו","נכשלו","זליגה","עומסים"];
const NV=[["home","דף הבית","⌂"],["ov","סקירה","◫"],["e2e","קצה לקצה","⇄"],["al","התראות","🔔"],["rs","תוצאות","▤"]];
const AL=[{t:"fl",ti:"זרימה נכשלה",f:"report_0412.csv",d:"19.11 · 09:12",r:0,x:"הזרימה נכשלה בשלב הפרסור עקב שדה חסר בשורה 214."},{t:"in",ti:"קובץ התקבל",f:"batch_88.zip",d:"19.11 · 08:55",r:0,x:"הקובץ נקלט ונכנס לתור הפרסור."},{t:"ar",ti:"קובץ הועבר לארכיון",f:"scan_2210.pdf",d:"19.11 · 08:30",r:0,x:"הקובץ אורכב בהצלחה."},{t:"in",ti:"קובץ התקבל",f:"lab_data_31.csv",d:"18.11 · 17:02",r:1,x:"הקובץ נקלט."},{t:"fl",ti:"זרימה נכשלה",f:"export_77.xml",d:"18.11 · 14:40",r:1,x:"הזרימה נכשלה בשלב האנוביס."},{t:"ar",ti:"קובץ הועבר לארכיון",f:"old_501.pdf",d:"17.11 · 11:20",r:1,x:"הקובץ אורכב."}];
const TY={in:["קליטה","var(--b)","⬇"],ar:["ארכיון","var(--m)","▣"],fl:["כשלים","var(--red)","⚠"]};
const CAP=[["פרסור","⚙","פירוק קבצים נכנסים למבנה אחיד",1],["אנוביס","◈","ניתוח ועיבוד הנתונים",1],["מעבדה","⚗","בדיקות ויישום שינויים",1],["ארכיון","▣","שמירה ואחסון לטווח ארוך",1],["ניטור והתראות","🔔","מעקב חי והתראות על חריגות",1],["מבט על זליגה ועומסים","◔","תצוגת עומסים וזליגות",0]];
const ST=["קליטה","פרסור","אנוביס","מעבדה / ארכיון"],FL={"report_0412.csv":1,"batch_88.zip":0,"scan_2210.pdf":3,"export_77.xml":2};
const EV=[["התקבל","קובץ התקבל","var(--b)","09:12"],["הופעלה","זרימה הופעלה","var(--m)","09:12"],["התחילה","זרימה התחילה","var(--a)","09:13"],["הסתיימה","זרימה הסתיימה","var(--grn)","09:20"],["נכשלה","זרימה נכשלה","var(--red)","09:31"],["התקבל","קובץ התקבל","var(--b)","09:44"],["התחילה","זרימה התחילה","var(--a)","09:45"],["הסתיימה","זרימה הסתיימה","var(--grn)","09:58"]];
const CF=[null,["התחילה"],["הסתיימה"],["נכשלה"]];
let sel=[0,0,0],page="home",dd=-1,bell=0,pn=null,md=null,cards=[{p:0,c:[0,1,2,3]},{p:1,c:[0,2,3,4]}],rg=0,cn=-1,evf="הכל",q="",rq="",cd={a:-1,i:0},ok=0;
const num=(p,i)=>((p+3)*37+i*53)%380+20,un=()=>AL.filter(a=>!a.r).length;
const spark=p=>{let v=[0,1,2,3,4,5,6].map(i=>num(p,i)),mx=Math.max(...v);return`<svg viewBox="0 0 120 36" width="100%" height="36"><defs><linearGradient id="g${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BC0F0" stop-opacity=".35"/><stop offset="1" stop-color="#5BC0F0" stop-opacity="0"/></linearGradient></defs><path d="M0,36 ${v.map((y,i)=>`L${i*20},${34-y/mx*30}`).join(" ")} L120,36Z" fill="url(#g${p})"/><polyline fill="none" stroke="#6B4BC2" stroke-width="2" points="${v.map((y,i)=>`${i*20},${34-y/mx*30}`).join(" ")}"/></svg>`};
function go(p){page=p;dd=-1;bell=0;render()}
function sh(){$("#sb").innerHTML=`<div class="logo"><i>◈</i>מדוזה</div>${page=="home"?'<p class="desc">ניטור, זרימה ובקרה של תהליכי נתונים מקצה לקצה</p>':''}`+NV.map(n=>`<button class="nv ${page==n[0]?"on":""}" onclick="go('${n[0]}')">${n[2]} ${n[1]}${n[0]=="al"&&un()?`<span class="bd">${un()}</span>`:""}</button>`).join("")}
function tb(){$("#tb").innerHTML=`<div class="sel">${H.map((o,i)=>`<div><button class="${dd==i?"on":""}" onclick="event.stopPropagation();dd=dd==${i}?-1:${i};bell=0;tb()">${o[sel[i]]} ▾</button>${dd==i?`<div class="dd">${o.map((x,j)=>`<button class="${j==sel[i]?"on":""}" onclick="sel[${i}]=${j};dd=-1;render()">${x}</button>`).join("")}</div>`:""}</div>`).join("")}</div><span class="sp"></span><div id="bellw"><button class="bell" onclick="event.stopPropagation();bell=!bell;dd=-1;tb()">🔔${un()?`<b>${un()}</b>`:""}</button>${bell?`<div class="bp"><b style="color:var(--h)">חדשות מאז הביקור האחרון</b>${AL.map((a,i)=>a.r?"":`<div class="al" onclick="op(${i})"><span class="ic" style="--k:${TY[a.t][1]}">${TY[a.t][2]}</span><div><div>${a.ti}</div><small style="color:var(--tx2)">${a.f} · ${a.d}</small></div></div>`).join("")||"<p>אין התראות חדשות</p>"}<button class="btn l" style="width:100%;margin-top:8px" onclick="go('al')">לכל ההתראות ←</button></div>`:""}</div>`}
function op(i){AL[i].r=1;pn=i;bell=0;render()}
function pnl(){$("#ov2").innerHTML=(pn!==null?(a=>`<div id="pn"><button class="btn l" onclick="pn=null;render()">✕ סגירה</button><h3>${a.ti}</h3><span class="pill ${a.t=="fl"?"r":""}">${TY[a.t][0]}</span><p>${a.x}</p><p style="color:var(--tx2)">קובץ: <a style="color:var(--b)">${a.f}</a><br>${a.d}</p><button class="btn">פתח קובץ</button></div>`)(AL[pn]):"")+(md?mdl():"")}
function mdl(){let m=md;return`<div id="md" onclick="md=null;pnl()"><div class="c" onclick="event.stopPropagation()"><h3 style="margin-top:0">הוספת כרטיסייה · שלב ${m.s}/2</h3>${m.s==1?`<div class="row">${PR.map((x,i)=>`<button class="chip ${m.p==i?"on":""}" onclick="md.p=${i};pnl()">${x}</button>`).join("")}</div><p><button class="btn" ${m.p<0?"disabled":""} onclick="md.s=2;pnl()">המשך</button></p>`:`<p>בחרי רכיבים להצגה:</p><div class="row">${CM.map((x,i)=>`<button class="chip ${m.c.includes(i)?"on":""}" onclick="tg(${i})">${x}</button>`).join("")}</div><p><button class="btn" onclick="cards.push({p:md.p,c:md.c});md=null;render()">הוספה</button> <button class="btn o" onclick="md.s=1;pnl()">חזרה</button></p>`}</div></div>`}
function tg(i){let c=md.c;c.includes(i)?c.splice(c.indexOf(i),1):c.push(i);pnl()}
function toast(t){let e=document.createElement("div");e.id="ts";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1800)}
function home(){return`<h1>דף הבית</h1><div class="row" style="margin-bottom:12px"><button class="btn" ${cards.length>=6?"disabled":""} onclick="md={s:1,p:-1,c:[0,1,2,3]};pnl()">+ הוספת כרטיסייה</button><small style="color:var(--tx2)">${cards.length}/6 כרטיסיות · הבורר העליון לא משפיע על דף זה</small></div><div id="cs">${cards.map((c,k)=>`<div class="c hc"><div class="row"><b style="color:var(--h);font-size:16px">${PR[c.p]}</b><span class="sp"></span><button class="btn l" title="מסך מלא" onclick="sel[0]=${c.p};go('e2e')">⤢</button></div>${spark(c.p)}${c.c.map(i=>`<div class="mt"><span>${CM[i]}</span><b>${num(c.p,i)}</b></div>`).join("")}</div>`).join("")}</div>`}
function ov(){return`<h1>סקירה</h1><div class="g3">${CAP.map(c=>`<div class="c tile ${c[3]?"":"off"}"><div class="row"><span class="ic" style="--k:var(--m);font-size:18px">${c[1]}</span><b style="color:var(--h)">${c[0]}</b><span class="sp"></span><span class="pill ${c[3]?"g":"x"}">${c[3]?"פעיל":"לא פעיל"}</span></div><p style="color:var(--tx2);margin:10px 0 0">${c[2]}</p></div>`).join("")}</div><h3>פייפליין</h3><div class="pl">${ST.map((s,i)=>`<div class="c st ${["ok","ok","run","bad"][i]}"><b>${s}</b><div class="big">${num(sel[0],i)}</div><small style="color:var(--tx2)">${["תקין","תקין","רץ כעת","תקלה"][i]} · עודכן 09:${10+i*7}</small></div>${i<3?'<span class="ar">◂</span>':""}`).join("")}</div>`}
function e2e(){let m=[1,7,30][rg],f=CF[cn+1],cs=[["נכנסו",412],["רצים כעת",23],["עברו בהצלחה",371],["נכשלו",18]];
return`<h1>קצה לקצה</h1><div class="row"><div class="row">${["24 שעות","שבוע","חודש"].map((x,i)=>`<button class="chip ${rg==i?"on":""}" onclick="rg=${i};render()">${x}</button>`).join("")}</div><span class="sp"></span><input type="text" id="si" placeholder="חיפוש קובץ…" value="${q}" oninput="q=this.value;$('#sr').innerHTML=sr()"></div><div id="sr">${sr()}</div><div class="g4" style="margin:14px 0">${cs.map((c,i)=>`<div class="c cn ${cn==i?"on":""}" onclick="cn=cn==${i}?-1:${i};render()"><small>${c[0]}</small><div class="big">${c[1]*(i==1?1:m)}</div></div>`).join("")}</div><div class="row" style="align-items:flex-start"><div class="c" style="flex:1"><div class="row">${["הכל","התקבל","הופעלה","התחילה","הסתיימה","נכשלה"].map(x=>`<button class="chip ${evf==x?"on":""}" onclick="evf='${x}';render()">${x}</button>`).join("")}</div><div class="tl" style="margin-top:12px">${EV.filter(e=>(evf=="הכל"||e[0]==evf)&&(!f||f.includes(e[0]))).map(e=>`<div class="ev" style="--d:${e[2]}">${e[1]} <small style="color:var(--tx2)">· ${e[3]}</small></div>`).join("")}</div></div><div class="c" style="flex:1"><table><tr><th>שלב</th><th>עברו</th><th>נכשלו</th><th>רצים</th></tr>${ST.map((s,i)=>`<tr><td>${s}</td><td>${num(0,i)*m}</td><td>${(i*3+2)*m}</td><td>${i+1}</td></tr>`).join("")}</table></div></div>`}
function sr(){let k=Object.keys(FL).find(f=>q&&f.includes(q.trim()));return k?`<div class="c" style="margin-top:10px"><b>${k}</b><div class="pth">${ST.map((s,i)=>`<span class="pill ${i<FL[k]?"g":i==FL[k]?"":"x"}">${s}${i==FL[k]?" · נוכחי":""}</span>${i<3?"◂":""}`).join("")}</div></div>`:""}
